# Railway config for the SPA service.
# In Railway: create a service with Root Directory = frontend (this folder).
#
# Required on invoice-ui (runtime — no rebuild to change):
#   API_URL = https://YOUR-BACKEND.up.railway.app
# Optional build-time:
#   VITE_API_URL (same URL), VITE_APP_NAME

[build]
builder = "NIXPACKS"
# Nixpacks already runs `npm ci` in the install phase — do not repeat it here (EBUSY on cache mount).
buildCommand = "VITE_API_URL=https://invoice-api-production-3d13.up.railway.app VITE_APP_NAME='Thai Invoice Extractor' npm run build"

[deploy]
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
