name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (unit + integration)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: invoice_extractor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d invoice_extractor_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoice_extractor_test
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/invoice_extractor_test
      JWT_SECRET: ci-github-actions-jwt-secret-min-32-chars
      JWT_ISSUER: thai-invoice-extractor
      JWT_AUDIENCE: thai-invoice-api
      ANTHROPIC_API_KEY: ci-anthropic-key-not-used-in-tests
      CLAUDE_MODEL: claude-sonnet-4-6
      ALLOWED_ORIGIN: http://localhost:5173
      UPLOAD_RATE_LIMIT_MAX: "1000"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_APP_NAME: Thai Invoice Extractor
        run: npm run build

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3000
          VITE_APP_NAME: Thai Invoice Extractor
        run: npm run build

      - name: Run E2E smoke tests
        env:
          CI: "true"
        run: npm run test:e2e
