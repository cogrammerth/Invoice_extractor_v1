# Local PostgreSQL only — for dev and integration tests.
#
# Start:  npm run db:up   (from repo root)
# Stop:   npm run db:down
#
# DATABASE_URL (backend/.env):
#   postgresql://invoice:invoice@localhost:5432/invoice_extractor

services:
  postgres:
    image: postgres:17-alpine
    container_name: invoice-extractor-postgres
    environment:
      POSTGRES_DB: invoice_extractor
      POSTGRES_USER: invoice
      POSTGRES_PASSWORD: invoice
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoice -d invoice_extractor"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - invoice_extractor_pgdata:/var/lib/postgresql/data

volumes:
  invoice_extractor_pgdata:
